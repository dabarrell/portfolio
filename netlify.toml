[build]
publish = "public"
command = "hugo --gc --minify -b $URL"

[build.environment]
HUGO_VERSION = "0.128.0"

[context.production.environment]
HUGO_ENV = "production"

[context.deploy-preview.environment]
command = "hugo --gc --minify --buildDrafts -b $DEPLOY_PRIME_URL"

[context.branch-deploy.environment]
command = "hugo --gc --minify --buildDrafts -b $DEPLOY_PRIME_URL"

# PostHog reverse proxy (keeps tracking first-party so ad blockers don't drop it)
[[redirects]]
from = "/m4p/static/*"
to = "https://us-assets.i.posthog.com/static/:splat"
status = 200
force = true

[[redirects]]
from = "/m4p/*"
to = "https://us.i.posthog.com/:splat"
status = 200
force = true
